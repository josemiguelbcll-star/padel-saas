<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Ícono principal (favicon + PWA) -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png" />

    <!-- Viewport: viewport-fit=cover para iPhones con notch/dynamic island -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />

    <!-- Theme color (marino MatchGo) — barra del sistema en Android -->
    <meta name="theme-color" content="#0B1F4D" />

    <!-- PWA general -->
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ── iOS / Safari ─────────────────────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent: el contenido va detrás de la status bar (safe-area-inset funciona) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MatchGo" />
    <!-- Ícono para "Agregar al inicio" en Safari -->
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon.svg" />

    <!-- Splash screens iOS (marino MatchGo mientras carga) -->
    <!-- iPhone 14 Pro Max -->
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
      href="/icons/splash-1290x2796.svg" />
    <!-- iPhone 14 / 13 / 12 -->
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
      href="/icons/splash-1170x2532.svg" />
    <!-- iPhone SE -->
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
      href="/icons/splash-750x1334.svg" />

    <!-- ── Open Graph (compartir en WhatsApp / redes) ────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="MatchGo — Pádel en Salta" />
    <meta property="og:description" content="Reservá tu cancha y encontrá gente de tu comunidad para jugar." />
    <meta property="og:image"       content="/assets/padel-1.jpg" />
    <meta property="og:locale"      content="es_AR" />

    <!-- Meta description estándar (Google la usa en resultados y
         verificaciones; og:description solo aplica a redes sociales). -->
    <meta name="description"
      content="MatchGo es una plataforma de gestión integral para clubes de pádel y tenis: grilla de turnos en vivo, reservas online, cuenta del turno, caja, inventario y finanzas. Los jugadores reservan canchas al instante desde la app." />

    <title>MatchGo — Reservá tu cancha</title>
    <!--
      Anti-flash del color de marca (0016 — etapa 1). Si el club tiene
      un color guardado en localStorage (lo escribe SessionProvider al
      cargar el club), lo aplicamos al token CSS --primary ANTES de que
      React monte. Sin esto, en cada reload se vería un instante con el
      azul default antes del color real del club.

      La clave 'club_color_primario' debe mantenerse en sync con
      LOCALSTORAGE_KEY_COLOR_MARCA en src/lib/clubBrand.ts (el script
      inline no puede importar de TS).
    -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('club_color_primario');
          if (v) document.documentElement.style.setProperty('--primary', v);
        } catch (e) {
          /* localStorage no disponible (modo privado, etc.) — sin preload. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Fallback para crawlers/sin JS: describe la app aunque el
           bundle no se ejecute (verificación de Google OAuth). -->
      <noscript>
        <main style="font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; line-height: 1.6;">
          <h1>MatchGo — Gestión para clubes de pádel y tenis</h1>
          <p>
            MatchGo es una plataforma de gestión integral para clubes de
            pádel y tenis. Permite a los clubes administrar la grilla de
            turnos en tiempo real, reservas online, turnos fijos, clases,
            caja y arqueos, inventario de buffet y shop, y reportes
            financieros del negocio.
          </p>
          <p>
            Los jugadores pueden reservar canchas al instante, dividir la
            cuenta del turno, unirse a clases y seguir sus reservas desde
            la app.
          </p>
          <p>
            <a href="/privacidad">Política de privacidad</a>
          </p>
        </main>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
