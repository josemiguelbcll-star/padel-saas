name: Android Build APK

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (Capacitor)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Instalar dependencias web
        run: npm ci

      - name: 🔨 Compilar Frontend (Vite)
        run: npm run build

      - name: 📱 Sincronizar Capacitor Android
        run: npx cap add android || npx cap sync android

      - name: 🤖 Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📦 Guardar APK en Artifacts de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: MatchGo-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
