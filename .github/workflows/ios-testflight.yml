name: iOS Build & TestFlight

# Compila la app de MatchGo (Capacitor + iOS) en un runner macOS y la sube a
# TestFlight usando una App Store Connect API Key.
#
# Secretos requeridos (Settings → Secrets and variables → Actions):
#   APP_STORE_CONNECT_KEY_ID      → Key ID de la API Key (.p8)
#   APP_STORE_CONNECT_ISSUER_ID   → Issuer ID de App Store Connect
#   APP_STORE_CONNECT_PRIVATE_KEY → contenido completo del archivo .p8
#   APPLE_TEAM_ID                 → Team ID de Apple Developer (10 caracteres)
#
# Requisitos previos en App Store Connect:
#   - Existe la app con bundle id `ar.matchgo.app`.
#   - El bundle id tiene habilitados los capabilities que uses (ej. Push).
#   - La API Key tiene rol "App Manager" o superior.

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Subir a TestFlight automáticamente'
        type: boolean
        default: true
        required: false
      build_number:
        description: 'Número de build (dejar vacío = número de ejecución)'
        type: string
        default: ''
        required: false

jobs:
  build-ios:
    name: Build iOS (Capacitor) & TestFlight
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias web
        run: npm ci

      - name: 🔨 Compilar Frontend (Vite)
        run: npm run build

      - name: 📱 Sincronizar Capacitor iOS
        run: npx cap sync ios

      - name: 🍏 Seleccionar Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: 🔑 Preparar App Store Connect API Key
        if: ${{ inputs.upload_testflight }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::Faltan los secrets APP_STORE_CONNECT_KEY_ID y/o APP_STORE_CONNECT_PRIVATE_KEY."
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: 🏗️ Archivar (xcodebuild archive)
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          BUILD_NUMBER="${{ inputs.build_number }}"
          if [ -z "$BUILD_NUMBER" ]; then BUILD_NUMBER="${{ github.run_number }}"; fi

          AUTH_FLAGS=""
          if [ -f "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" ]; then
            AUTH_FLAGS="-allowProvisioningUpdates \
              -authenticationKeyPath $HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
              -authenticationKeyID ${KEY_ID} \
              -authenticationKeyIssuerID ${ISSUER_ID}"
          fi

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            ${AUTH_FLAGS} \
            archive

      - name: 📦 Guardar Archive como artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatchGo-iOS-Archive
          path: ${{ runner.temp }}/App.xcarchive
          retention-days: 14

      - name: 🚀 Exportar y subir a TestFlight
        if: ${{ inputs.upload_testflight }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed "s/__TEAM_ID__/${TEAM_ID}/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "${KEY_ID}" \
            -authenticationKeyIssuerID "${ISSUER_ID}"

          echo "✅ Build subido a TestFlight. Va a tardar unos minutos en aparecer en App Store Connect."
